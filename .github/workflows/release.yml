name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun test

      - name: Build macOS arm64
        run: bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/wd-bin-darwin-arm64

      - name: Build macOS x64
        run: bun build src/index.ts --compile --target=bun-darwin-x64 --outfile dist/wd-bin-darwin-x64

      - name: Build Linux arm64
        run: bun build src/index.ts --compile --target=bun-linux-arm64 --outfile dist/wd-bin-linux-arm64

      - name: Build Linux x64
        run: bun build src/index.ts --compile --target=bun-linux-x64 --outfile dist/wd-bin-linux-x64

      - name: Create tarballs
        run: |
          mkdir -p staging
          cp shell/wd.zsh shell/wd.bash shell/wd.fish shell/wd.ps1 shell/wd.nu staging/
          cp dist/wd-bin-darwin-arm64 staging/wd-bin
          tar -czf dist/wd-macos-arm64.tar.gz -C staging wd-bin wd.zsh wd.bash wd.fish wd.ps1 wd.nu
          cp dist/wd-bin-darwin-x64 staging/wd-bin
          tar -czf dist/wd-macos-x64.tar.gz -C staging wd-bin wd.zsh wd.bash wd.fish wd.ps1 wd.nu
          cp dist/wd-bin-linux-arm64 staging/wd-bin
          tar -czf dist/wd-linux-arm64.tar.gz -C staging wd-bin wd.zsh wd.bash wd.fish wd.ps1 wd.nu
          cp dist/wd-bin-linux-x64 staging/wd-bin
          tar -czf dist/wd-linux-x64.tar.gz -C staging wd-bin wd.zsh wd.bash wd.fish wd.ps1 wd.nu

      - name: Generate checksums
        run: |
          cd dist
          sha256sum wd-macos-arm64.tar.gz wd-macos-x64.tar.gz wd-linux-arm64.tar.gz wd-linux-x64.tar.gz > checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/wd-macos-arm64.tar.gz
            dist/wd-macos-x64.tar.gz
            dist/wd-linux-arm64.tar.gz
            dist/wd-linux-x64.tar.gz
            dist/checksums.sha256

      - name: Trigger Homebrew tap update
        if: success()
        run: |
          ARM64_SHA=$(sha256sum dist/wd-macos-arm64.tar.gz | cut -d' ' -f1)
          X64_SHA=$(sha256sum dist/wd-macos-x64.tar.gz | cut -d' ' -f1)
          VERSION=${GITHUB_REF_NAME#v}
          gh workflow run update-formula.yml \
            --repo kerdofficial/homebrew-tap \
            -f version="$VERSION" \
            -f sha256_arm64="$ARM64_SHA" \
            -f sha256_x64="$X64_SHA"
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
